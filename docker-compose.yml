version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: oxen_postgres
    environment:
      POSTGRES_USER: oxenorm
      POSTGRES_PASSWORD: oxenorm
      POSTGRES_DB: oxenorm
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oxenorm']
      interval: 5s
      timeout: 5s
      retries: 20
