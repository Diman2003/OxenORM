version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: oxenorm-postgres
    environment:
      POSTGRES_USER: oxenorm
      POSTGRES_PASSWORD: oxenorm
      POSTGRES_DB: oxenorm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxenorm"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
