name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  MATURIN_PASSWORD: ${{ secrets.PYPI_TOKEN }}

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        target: [x86_64, aarch64]
        exclude:
          # Exclude aarch64 on Windows (not supported)
          - os: windows-latest
            target: aarch64
          # Exclude aarch64 on macOS for older Python versions
          - os: macos-latest
            python-version: '3.9'
            target: aarch64
          - os: macos-latest
            python-version: '3.10'
            target: aarch64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.target }}-unknown-${{ matrix.os == 'windows-latest' && 'msvc' || 'gnu' }}-${{ matrix.os == 'macos-latest' && 'darwin' || matrix.os == 'windows-latest' && 'windows' || 'linux' }}

    - name: Install maturin
      run: |
        python -m pip install --upgrade pip
        pip install maturin

    - name: Build wheels
      run: |
        maturin build --release --target ${{ matrix.target }}-unknown-${{ matrix.os == 'windows-latest' && 'msvc' || 'gnu' }}-${{ matrix.os == 'macos-latest' && 'darwin' || matrix.os == 'windows-latest' && 'windows' || 'linux' }}
      env:
        MATURIN_PASSWORD: ${{ secrets.PYPI_TOKEN }}

    - name: Upload wheels to PyPI
      run: |
        maturin upload --username __token__ --password ${{ secrets.PYPI_TOKEN }} target/wheels/*.whl

  build-source:
    runs-on: ubuntu-latest
    needs: build-and-publish

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build source distribution
      run: |
        python -m build --sdist

    - name: Upload source to PyPI
      run: |
        twine upload --username __token__ --password ${{ secrets.PYPI_TOKEN }} dist/*.tar.gz

  test-installation:
    runs-on: ${{ matrix.os }}
    needs: [build-and-publish, build-source]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test installation
      run: |
        pip install oxen-orm
        python -c "import oxen; print('✅ OxenORM installed successfully!')"
        python -c "from oxen import Model; print('✅ Model class available!')"
        python -c "from oxen.cli import main; print('✅ CLI tool available!')" 