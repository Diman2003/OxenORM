name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install maturin
      run: |
        python -m pip install --upgrade pip
        pip install maturin

    - name: Build Rust extension
      run: maturin develop --release

    - name: Install Python dependencies
      run: |
        pip install -e .
        pip install ruff mypy pytest pytest-asyncio pytest-cov black

    - name: Lint with ruff
      run: |
        ruff check oxen/ tests/
        ruff format --check oxen/ tests/

    - name: Type check with mypy
      run: |
        mypy oxen/ --ignore-missing-imports

    - name: Run Python tests
      run: |
        pytest tests/ -v --cov=oxen --cov-report=xml

    - name: Run Rust tests
      run: |
        cargo test --manifest-path Cargo.toml

    - name: Run Rust clippy
      run: |
        cargo clippy --manifest-path Cargo.toml -- -D warnings

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build-wheels:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Install maturin
      run: |
        python -m pip install --upgrade pip
        pip install maturin

    - name: Build wheels
      run: |
        maturin build --release --out dist

    - name: Upload wheels to artifacts
      uses: actions/upload-artifact@v3
      with:
        name: wheels
        path: dist/ 