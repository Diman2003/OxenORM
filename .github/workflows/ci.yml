name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin and deps
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio
      - name: Build Rust extension
        run: |
          maturin develop --release
      - name: Run unit tests (no DB)
        env:
          OXEN_RUST_BACKEND: '1'
        run: |
          pytest -q tests/test_rust_builder_sql.py tests/test_debug_engine.py tests/test_queryset_debug.py tests/test_queryset_final.py tests/test_queryset_fresh.py

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin and deps
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio
      - name: Build Rust extension
        run: |
          maturin develop --release
      - name: Run sqlite tests
        env:
          OXEN_RUST_BACKEND: '1'
        run: |
          pytest -q tests/test_sqlite_basic.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oxenorm
          POSTGRES_PASSWORD: oxenorm
          POSTGRES_DB: oxenorm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxenorm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin and deps
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio
      - name: Build Rust extension
        run: |
          maturin develop --release
      - name: Wait for Postgres
        run: |
          for i in {1..60}; do
            nc -z localhost 5432 && echo "Postgres is up" && break
            sleep 2
          done
      - name: Run postgres tests
        env:
          OXEN_RUST_BACKEND: '1'
        run: |
          pytest -q tests/test_postgresql_* 
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        rust-version: ["1.70", "stable"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Rust ${{ matrix.rust-version }}
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust-version }}
        override: true

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Build Rust extension
      run: |
        pip install maturin
        maturin build --release

    - name: Install OxenORM
      run: |
        maturin install --release

    - name: Run tests
      run: |
        python -m pytest tests/ -v --cov=oxen --cov-report=xml

    - name: Run production tests
      run: |
        python test_phase3_production.py

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Install dependencies
      run: |
        pip install ruff black mypy
        pip install maturin

    - name: Run Python linting
      run: |
        ruff check oxen/ tests/ examples/
        black --check oxen/ tests/ examples/
        mypy oxen/

    - name: Run Rust linting
      run: |
        cargo clippy --all-targets --all-features -- -D warnings

    - name: Run Rust formatting check
      run: |
        cargo fmt --all -- --check

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run security scan
      run: |
        bandit -r oxen/ -f json -o bandit-report.json || true
        safety check --json --output safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Install build tools
      run: |
        pip install maturin twine build

    - name: Build package
      run: |
        maturin build --release --out dist
        python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install maturin

    - name: Build and install
      run: |
        maturin install --release

    - name: Run performance benchmarks
      run: |
        python benchmarks/performance_test.py

    - name: Generate performance graphs
      run: |
        python scripts/generate_performance_graph.py

    - name: Upload performance graphs
      uses: actions/upload-artifact@v3
      with:
        name: performance-graphs
        path: docs/_static/*.png

  documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install documentation dependencies
      run: |
        pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/_build/html/ 