services:
  postgres:
    image: postgres:16-alpine
    container_name: oxen_full_postgres
    environment:
      POSTGRES_USER: oxenorm
      POSTGRES_PASSWORD: oxenorm
      POSTGRES_DB: oxenorm
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxenorm"]
      interval: 5s
      timeout: 5s
      retries: 20
  mysql:
    image: mysql:8.0
    container_name: oxen_full_mysql
    environment:
      MYSQL_ROOT_PASSWORD: oxenorm
      MYSQL_DATABASE: oxenorm
      MYSQL_USER: oxenorm
      MYSQL_PASSWORD: oxenorm
    ports:
      - "3310:3306"
    command: ["--default-authentication-plugin=mysql_native_password", "--max_connections=200"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uoxenorm", "-poxenorm"]
      interval: 5s
      timeout: 5s
      retries: 20

